<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SLOT BATTLE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e0e16;--panel:#14141f;--border:#28284a;
  --gold:#e8c840;--red:#ff4060;--teal:#3eeec4;--purple:#b06afc;
  --text:#e8e8f2;--dim:#555580;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  height:100dvh;display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 15% 5%,rgba(80,40,160,.15) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 95%,rgba(160,40,60,.12) 0%,transparent 55%);
  pointer-events:none;z-index:0;
}
#app{
  width:100%;max-width:420px;height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 8px 8px;gap:5px;
  position:relative;z-index:1;overflow:hidden;
}
.title{
  font-family:'Orbitron',monospace;font-size:14px;font-weight:900;
  letter-spacing:.18em;color:var(--gold);
  text-shadow:0 0 14px rgba(232,200,64,.5);flex-shrink:0;
}
/* Enemy */
.enemy-area{
  width:100%;background:var(--panel);border:1px solid var(--border);
  border-radius:11px;padding:6px 11px;
  display:flex;align-items:center;gap:9px;flex-shrink:0;
}
.enemy-sprite{font-size:30px;line-height:1;flex-shrink:0;
  filter:drop-shadow(0 0 8px rgba(255,64,96,.45));}
.enemy-sprite.hit{animation:eHit .38s ease;}
@keyframes eHit{
  0%{transform:translateX(0) scale(1)}
  20%{transform:translateX(-7px) scale(1.07)}
  50%{transform:translateX(5px) scale(.94)}
  80%{transform:translateX(-3px)}
  100%{transform:translateX(0) scale(1)}
}
.enemy-info{flex:1;display:flex;flex-direction:column;gap:4px;}
.enemy-header{display:flex;justify-content:space-between;align-items:center;}
.enemy-name{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;
  color:var(--red);letter-spacing:.08em;}
#hp-text{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;}
.hp-bar-outer{width:100%;height:9px;background:#12122a;border-radius:5px;
  overflow:hidden;border:1px solid var(--border);}
#hp-bar{height:100%;background:linear-gradient(90deg,#ff4060,#ff8050);
  border-radius:5px;transition:width .55s cubic-bezier(.4,0,.2,1);position:relative;}
#hp-bar::after{content:'';position:absolute;top:2px;left:4px;right:4px;
  height:2px;background:rgba(255,255,255,.28);border-radius:2px;}
/* Chars */
.chars-row{display:flex;gap:6px;width:100%;flex-shrink:0;}
.char-slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;}
.char-bubble{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;
}
.char-emoji{font-size:18px;line-height:1;}
.char-emoji.attack{animation:cAtk .42s ease;}
@keyframes cAtk{0%{transform:translateY(0) scale(1)}35%{transform:translateY(9px) scale(1.15)}70%{transform:translateY(-3px) scale(.95)}100%{transform:translateY(0) scale(1)}}
.char-name{font-family:'Orbitron',monospace;font-size:7px;color:var(--dim);letter-spacing:.04em;}
.char-arrow{font-size:10px;color:var(--gold);opacity:0;transition:opacity .3s;line-height:1;}
.char-arrow.show{opacity:1;}
/* Slot machine */
.slot-machine{
  width:100%;flex:1;min-height:0;
  background:#09090f;
  border:3px solid #3a3a60;border-radius:14px;
  overflow:hidden;position:relative;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.7),0 0 18px rgba(0,0,0,.5);
}
/* Reels */
.reels-row{position:absolute;inset:0;display:flex;}
.reel-col{
  flex:1;position:relative;overflow:hidden;cursor:pointer;
  border-right:2px solid #1c1c34;
}
.reel-col:last-child{border-right:none;}
.reel-col.spinning{background:rgba(232,200,64,.02);}
.reel-col.stopped {background:rgba(62,238,196,.02);}
/* TAP hint */
.tap-hint{
  position:absolute;bottom:6px;left:0;right:0;
  display:flex;justify-content:center;
  pointer-events:none;z-index:20;opacity:0;transition:opacity .25s;
}
.reel-col.spinning .tap-hint{opacity:1;animation:hPulse .85s ease-in-out infinite;}
@keyframes hPulse{0%,100%{opacity:.4}50%{opacity:1}}
.tap-hint-inner{
  background:rgba(232,200,64,.1);border:1px solid rgba(232,200,64,.35);
  border-radius:4px;padding:1px 6px;
  font-size:8px;color:var(--gold);font-family:'Orbitron',monospace;letter-spacing:.1em;
}
/* Win overlays (横・斜めのみ) */
.row-overlay{position:absolute;left:0;right:0;pointer-events:none;z-index:10;opacity:0;}
.row-overlay.flash{animation:rFlash .8s ease forwards;}
@keyframes rFlash{0%{opacity:0}25%{opacity:1}70%{opacity:.8}100%{opacity:0}}
#diag-canvas{position:absolute;inset:0;pointer-events:none;z-index:11;opacity:0;}
#diag-canvas.flash{animation:rFlash .8s ease forwards;}
/* Win line bar */
.winline-bar{
  position:absolute;top:0;left:0;right:0;height:4px;
  z-index:25;pointer-events:none;display:flex;
}
.winline-seg{flex:1;transition:background .3s,box-shadow .3s;}
/* Result */
.result-area{
  width:100%;min-height:32px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
#damage-text{
  font-family:'Orbitron',monospace;font-size:22px;font-weight:900;
  color:var(--gold);text-shadow:0 0 16px rgba(232,200,64,.65);
  opacity:0;transform:scale(.6) translateY(8px);
  transition:all .32s cubic-bezier(.34,1.56,.64,1);
}
#damage-text.show{opacity:1;transform:scale(1) translateY(0);}
#result-sub{font-size:9px;color:var(--dim);opacity:0;transition:opacity .3s .1s;letter-spacing:.04em;}
#result-sub.show{opacity:1;}
.instruction{font-size:10px;color:var(--dim);text-align:center;flex-shrink:0;letter-spacing:.04em;}
#main-btn{
  width:100%;max-width:250px;height:42px;border:none;border-radius:21px;
  font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:.14em;
  cursor:pointer;transition:all .16s;flex-shrink:0;
}
#main-btn:active{transform:scale(.94);}
#main-btn.start-btn{background:linear-gradient(135deg,#e8c840,#ff8c40);color:#0a0a12;
  box-shadow:0 3px 14px rgba(232,200,64,.35);}
#main-btn.reset-btn{background:linear-gradient(135deg,#3eeec4,#3880f0);color:#0a0a12;
  box-shadow:0 3px 14px rgba(62,238,196,.3);}
#main-btn.disabled{background:#1a1a2c;color:#3a3a60;cursor:default;box-shadow:none;}
/* Victory */
#victory-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;z-index:100;opacity:0;pointer-events:none;transition:opacity .5s;
}
#victory-overlay.show{opacity:1;pointer-events:all;}
.victory-title{
  font-family:'Orbitron',monospace;font-size:32px;font-weight:900;
  color:var(--gold);text-shadow:0 0 32px rgba(232,200,64,.8);
  animation:vPulse 1.4s ease-in-out infinite;
}
@keyframes vPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.victory-sub{font-size:13px;color:var(--text);opacity:.65;}
#victory-btn{
  padding:11px 34px;border:none;border-radius:22px;
  background:linear-gradient(135deg,#e8c840,#ff8c40);color:#0a0a12;
  font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:.14em;
  cursor:pointer;box-shadow:0 4px 16px rgba(232,200,64,.4);
}
.stars{font-size:32px;letter-spacing:6px;animation:sFloat 2s ease-in-out infinite;}
@keyframes sFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</head>
<body>
<div id="app">
  <div class="title">⚔ SLOT BATTLE</div>
  <div class="enemy-area">
    <div class="enemy-sprite" id="enemy-sprite">🐉</div>
    <div class="enemy-info">
      <div class="enemy-header">
        <span class="enemy-name">DARK DRAGON</span>
        <span id="hp-text">300 / 300</span>
      </div>
      <div class="hp-bar-outer"><div id="hp-bar" style="width:100%"></div></div>
    </div>
  </div>
  <div class="chars-row" id="chars-row"></div>
  <div class="slot-machine" id="slot-machine">
    <div class="winline-bar" id="winline-bar"></div>
    <div class="reels-row" id="reels-row"></div>
    <div class="row-overlay" id="ro-0"></div>
    <div class="row-overlay" id="ro-1"></div>
    <div class="row-overlay" id="ro-2"></div>
    <canvas id="diag-canvas"></canvas>
  </div>
  <div class="result-area">
    <div id="damage-text">— DMG</div>
    <div id="result-sub"></div>
  </div>
  <div class="instruction" id="instruction">STARTを押してリールを回転させよう</div>
  <button id="main-btn" class="start-btn" onclick="onMainBtn()">START</button>
</div>
<div id="victory-overlay">
  <div class="stars">⭐⭐⭐</div>
  <div class="victory-title">VICTORY!</div>
  <div class="victory-sub">敵を倒した！</div>
  <button id="victory-btn" onclick="onVictoryBtn()">PLAY AGAIN</button>
</div>

// ════════════════════════════════════════════════════════════
// ■ 図柄定義
//   各図柄の id / 表示名 / ダメージ倍率 / グロー色 を設定します。
//   ・mult  : 揃ったときのダメージ倍率 (BASE_DMG × mult)
//   ・glow  : リール背景のグロー色
//   ※ BLANK(id:0) は「揃ってもダメージなし」の特殊扱いです
// ════════════════════════════════════════════════════════════
const SYM = [
  // idx=0  BLANK (シルバー7) — 揃ってもダメージなし
  { id:'BLANK', img:null, mult:0,   glow:'#a0a0b0', bg:'#0e0e14' },
  // idx=1  FIRE  (赤炎7)   — 倍率2.0
  { id:'FIRE',  img:null, mult:2.0, glow:'#ff6020', bg:'#120808' },
  // idx=2  WATER (青水7)   — 倍率2.5
  { id:'WATER', img:null, mult:2.5, glow:'#40a0ff', bg:'#080c18' },
  // idx=3  WOOD  (緑葉7)   — 倍率3.0
  { id:'WOOD',  img:null, mult:3.0, glow:'#40c040', bg:'#081208' },
  // idx=4  DARK  (紫炎7)   — 倍率5.0
  { id:'DARK',  img:null, mult:5.0, glow:'#a050ff', bg:'#0e0818' },
  // idx=5  LIGHT (金7)     — 倍率6.0 (最高レア)
  { id:'LIGHT', img:null, mult:6.0, glow:'#ffe060', bg:'#141008' },
];
const SYM_N = SYM.length; // 図柄の種類数 (現在=6)

// ════════════════════════════════════════════════════════════
// ■ リールストリップ定義
//   各リールの「コマ配列」を設定します。
//
//   変更方法:
//     - 配列の長さ = そのリールのコマ総数
//       例: 長さ20なら20コマが一周で一巡する
//     - 配列の数値 = SYM のインデックス (0=BLANK, 1=FIRE, ...)
//     - BLANK(0) を多く入れるほどレアシンボルが出にくくなります
//
//   ■「推しコマ」調整について
//     実際のパチスロのように「中段狙い」「上段狙い」などを
//     実現したい場合は、狙いたいコマの前後にBLANKを配置します。
//     例: [0,0,5,0,0,...]  → 5(LIGHT)の前後を0(BLANK)で囲む
//         → 止めるタイミングがドンピシャでないとLIGHTが出ない
//
//   ■ 現在の3リール共通設定:
//     BLANK:0が多め → レアは出にくい設定
// ════════════════════════════════════════════════════════════
const REEL_STRIPS = [
  // ▼ リール1 (左)  コマ数=18
  [1, 0, 2, 0, 3, 0, 1, 0, 4, 0, 2, 0, 5, 0, 3, 0, 1, 0],
  // ▼ リール2 (中)  コマ数=18
  [2, 0, 3, 0, 1, 0, 4, 0, 2, 0, 5, 0, 1, 0, 3, 0, 2, 0],
  // ▼ リール3 (右)  コマ数=18
  [3, 0, 1, 0, 4, 0, 2, 0, 3, 0, 1, 0, 5, 0, 2, 0, 4, 0],
];
// ストリップ長 (全リール共通と仮定)
const STRIP_LEN = REEL_STRIPS[0].length;

// ════════════════════════════════════════════════════════════
// ■ 勝利ライン定義 — 横3本 + 斜め2本 のみ (縦は除外)
//   cells: [[col,row], [col,row], [col,row]]
//     col = 0:左 / 1:中 / 2:右
//     row = 0:上 / 1:中 / 2:下
// ════════════════════════════════════════════════════════════
const WIN_LINES = [
  { id:'H-TOP', cells:[[0,0],[1,0],[2,0]], color:'#e8c840', type:'H', row:0 },
  { id:'H-MID', cells:[[0,1],[1,1],[2,1]], color:'#e8c840', type:'H', row:1 },
  { id:'H-BOT', cells:[[0,2],[1,2],[2,2]], color:'#e8c840', type:'H', row:2 },
  { id:'D-B',   cells:[[0,0],[1,1],[2,2]], color:'#b06afc', type:'D', diag:0 },
  { id:'D-F',   cells:[[0,2],[1,1],[2,0]], color:'#b06afc', type:'D', diag:1 },
];

// キャラクター (各リールの上に表示)
const CHARACTERS = [
  { emoji:'⚔️', name:'WARRIOR' },
  { emoji:'🔮', name:'MAGE'    },
  { emoji:'🏹', name:'ARCHER'  },
];

const REEL_COUNT   = 3;
const VISIBLE_ROWS = 3; // リールに見えるコマ数

// ════════════════════════════════════════════════════════════
// ■ スピード設定
//   SPIN_PPS : リールのスクロール速度 (ピクセル/秒)
//   大きいほど速い。おすすめ範囲: 400〜1500
//   例: 600 = ゆっくり / 900 = 標準 / 1400 = 激速
// ════════════════════════════════════════════════════════════
const SPIN_PPS = 780; // ← ここを変更してください

const MAX_HP   = 300;
const BASE_DMG = 15; // 基本ダメージ (× mult で実ダメ)

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let enemyHP   = MAX_HP;
let reels     = [];
let gamePhase = 'idle';
let cellPx    = 70;
// grid[col][row] = SYMインデックス (停止後に書き込む)
let grid = [[0,0,0],[0,0,0],[0,0,0]];

// ════════════════════════════════════════════════════════════
// 画像ロード
// ════════════════════════════════════════════════════════════
function loadSymImages(){
  const map = {
    BLANK:IMG_BLANK, LIGHT:IMG_LIGHT, DARK:IMG_DARK,
    WOOD:IMG_WOOD, WATER:IMG_WATER, FIRE:IMG_FIRE,
  };
  SYM.forEach(s=>{ const im=new Image(); im.src=map[s.id]; s.img=im; });
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
function init(){
  loadSymImages();
  enemyHP=MAX_HP; gamePhase='idle';
  grid=[[0,0,0],[0,0,0],[0,0,0]];
  // ▼ reels配列は前回のoffsetを引き継ぐため再利用する
  //   初回のみ空なのでbuildLayoutで生成する
  updateHPUI(); buildChars(); buildLayout(); clearResult();
  setInstruction('STARTを押してリールを回転させよう');
  setMainBtn('start');
}

// ── キャラクター行 ──────────────────────────────────────────
function buildChars(){
  const row=document.getElementById('chars-row');
  row.innerHTML='';
  CHARACTERS.forEach((ch,i)=>{
    const slot=mk('div','char-slot');
    const bub=mk('div','char-bubble');
    const em=mk('div','char-emoji'); em.id=`ce-${i}`; em.textContent=ch.emoji;
    const nm=mk('div','char-name');  nm.textContent=ch.name;
    const ar=mk('div','char-arrow'); ar.id=`ca-${i}`; ar.textContent='▼';
    bub.append(em,nm); slot.append(bub,ar); row.appendChild(slot);
  });
}

// ════════════════════════════════════════════════════════════
// レイアウト構築
// ════════════════════════════════════════════════════════════
function buildLayout(){
  const reelsRow=document.getElementById('reels-row');
  reelsRow.innerHTML='';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const mach  = document.getElementById('slot-machine');
    const machH = mach.getBoundingClientRect().height || 210;
    const machW = mach.getBoundingClientRect().width  || 300;
    cellPx      = Math.floor(machH / VISIBLE_ROWS);
    const colW  = Math.floor(machW / REEL_COUNT);

    // 横ライン用オーバーレイのサイズ設定
    for(let r=0;r<VISIBLE_ROWS;r++){
      const ov=document.getElementById(`ro-${r}`);
      ov.style.cssText=`top:${r*cellPx}px;height:${cellPx}px;left:0;right:0;`;
    }

    // 斜めライン用キャンバス
    const dc=document.getElementById('diag-canvas');
    dc.width=machW; dc.height=machH;
    dc.style.width=machW+'px'; dc.style.height=machH+'px';

    // 勝利ラインバー (画面上部の細ライン)
    const bar=document.getElementById('winline-bar');
    bar.innerHTML='';
    WIN_LINES.forEach(l=>{
      const s=mk('div','winline-seg'); s.id=`wl-${l.id}`; bar.appendChild(s);
    });

    // リール列生成
    for(let i=0;i<REEL_COUNT;i++){
      // ▼ 前回の offset を引き継ぐ (再始動対応)
      const prevOffset = reels[i] ? reels[i].offset : Math.random()*STRIP_LEN*cellPx;

      const reel={
        index : i,
        strip : [...REEL_STRIPS[i]],
        cellPx,
        // ▼ 前回停止位置から再開 — 初回はランダム位置
        offset  : prevOffset,
        spinning: false,
        stopped : false,
        rafId   : null,
        lastTime: null,
        colEl   : null,
        canvas  : null,
      };
      const col=mk('div','reel-col');
      col.addEventListener('click',    ()=>onReelTap(i));
      col.addEventListener('touchend', e=>{e.preventDefault();onReelTap(i);});

      const cv=document.createElement('canvas');
      cv.style.cssText='position:absolute;inset:0;';
      cv.width=colW; cv.height=machH;
      col.appendChild(cv);

      const hint=mk('div','tap-hint');
      hint.innerHTML='<div class="tap-hint-inner">TAP</div>';
      col.appendChild(hint);

      reelsRow.appendChild(col);
      reel.colEl=col; reel.canvas=cv;
      // ▼ reels配列を上書き (古いエントリを置き換え)
      reels[i]=reel;
      drawReel(reel);
    }
  }));
}

// ════════════════════════════════════════════════════════════
// キャンバス描画
//   offset が増加 → 図柄が下方向にスクロール (上から下に流れる)
//   表示される3コマ:
//     row0(上) = strip[ floor(offset/cellPx)     % STRIP_LEN ]
//     row1(中) = strip[ floor(offset/cellPx) + 1 % STRIP_LEN ]
//     row2(下) = strip[ floor(offset/cellPx) + 2 % STRIP_LEN ]
// ════════════════════════════════════════════════════════════
function drawReel(reel){
  const {canvas,cellPx:cp,offset,strip}=reel;
  const ctx=canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#09090f';
  ctx.fillRect(0,0,w,h);

  const sub  = offset % cp;
  const base = Math.floor(offset / cp);

  for(let row=0;row<=VISIBLE_ROWS;row++){
    const stripIdx = (base+row) % STRIP_LEN;
    const sym      = SYM[strip[stripIdx]];
    const sy       = Math.round(row*cp - sub);

    // グロー背景
    const rg=ctx.createRadialGradient(w/2,sy+cp/2,0,w/2,sy+cp/2,cp*.5);
    rg.addColorStop(0,sym.glow+'20'); rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg; ctx.fillRect(0,sy,w,cp);

    // 図柄描画
    if(sym.img&&sym.img.complete&&sym.img.naturalWidth>0){
      // 画像のアスペクト比を保ちつつセルに収める
      const iw=sym.img.naturalWidth, ih=sym.img.naturalHeight;
      const pad=Math.floor(cp*.07);
      const maxW=w-pad*2, maxH=cp-pad*2;
      const scale=Math.min(maxW/iw,maxH/ih);
      const dw=Math.round(iw*scale), dh=Math.round(ih*scale);
      const dx=Math.floor((w-dw)/2), dy=sy+Math.floor((cp-dh)/2);
      ctx.drawImage(sym.img,dx,dy,dw,dh);
    } else {
      // 画像未ロード時のフォールバック
      ctx.fillStyle=sym.glow;
      ctx.font=`bold ${Math.floor(cp*.55)}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('7',w/2,sy+cp/2);
    }
  }
}

// ════════════════════════════════════════════════════════════
// スピン処理
// ════════════════════════════════════════════════════════════
function startAllReels(){ reels.forEach(r=>{ if(r) startReel(r); }); }

function startReel(reel){
  reel.spinning=true; reel.stopped=false; reel.lastTime=null;
  reel.colEl.className='reel-col spinning';
  spinLoop(reel);
}

function spinLoop(reel){
  if(!reel.spinning) return;
  reel.rafId=requestAnimationFrame(now=>{
    if(!reel.lastTime) reel.lastTime=now;
    const dt=Math.min((now-reel.lastTime)/1000,.05);
    reel.lastTime=now;
    // offset を SPIN_PPS px/sec で増加させる
    reel.offset=(reel.offset+SPIN_PPS*dt)%(STRIP_LEN*reel.cellPx);
    drawReel(reel);
    spinLoop(reel);
  });
}

function stopReel(reel){
  if(!reel.spinning||reel.stopped) return;
  reel.spinning=false; reel.stopped=true;
  cancelAnimationFrame(reel.rafId);

  // ════════════════════════════════════════════════════════
  // ■ スナップ位置 = 「中段の図柄」の調整
  //
  //   現在の実装:
  //     Math.round(offset / cellPx) でセル境界にスナップ
  //     → row1(中段) が「止まった瞬間のコマ」になる
  //
  //   ■「推しコマ」を変えたい場合:
  //     スナップ後の base = floor(offset/cellPx) として
  //       中段(row1) = strip[(base+1) % STRIP_LEN]
  //       上段(row0) = strip[(base+0) % STRIP_LEN]
  //       下段(row2) = strip[(base+2) % STRIP_LEN]
  //
  //   例: 「3コマ目(下段)推し」にしたい場合
  //     → WIN_LINES の cells の row 部分を 2 に変更し、
  //       中段狙いなら row:1、上段なら row:0 に統一する
  //
  //   現状: 横ラインは上中下すべてが対象なので
  //         どの段に止めても揃う可能性があります
  // ════════════════════════════════════════════════════════
  reel.offset=Math.round(reel.offset/reel.cellPx)*reel.cellPx;
  drawReel(reel);

  // グリッドに停止位置を書き込む
  const base=Math.floor(reel.offset/reel.cellPx);
  for(let row=0;row<VISIBLE_ROWS;row++){
    grid[reel.index][row]=reel.strip[(base+row)%STRIP_LEN];
  }
  reel.colEl.className='reel-col stopped';
  triggerCharAttack(reel.index);
  checkAllStopped();
}

// ════════════════════════════════════════════════════════════
// 勝利判定 — BLANK(idx=0) は揃っても無効
// ════════════════════════════════════════════════════════════
function evaluateWins(){
  return WIN_LINES
    .map(line=>{
      const syms=line.cells.map(([c,r])=>grid[c][r]);
      if(syms[0]===syms[1]&&syms[1]===syms[2]&&syms[0]!==0)
        return {line, sym:SYM[syms[0]]};
      return null;
    })
    .filter(Boolean);
}

function checkAllStopped(){
  if(!reels.every(r=>r&&r.stopped)) return;
  gamePhase='result';
  setTimeout(showResult,300);
}

// ════════════════════════════════════════════════════════════
// 結果表示
// ════════════════════════════════════════════════════════════
function showResult(){
  const hits=evaluateWins();
  let dmg=0; const names=[];
  if(!hits.length){ names.push('NO WIN'); }
  else{ hits.forEach(h=>{ dmg+=Math.round(BASE_DMG*h.sym.mult); names.push(h.line.id); }); }

  flashWins(hits);

  const de=document.getElementById('damage-text');
  const se=document.getElementById('result-sub');
  de.textContent=dmg>0?`${dmg} DMG`:'NO WIN';
  se.textContent=names.join(' · ');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    de.classList.add('show'); se.classList.add('show');
  }));

  if(dmg>0){
    enemyHP=Math.max(0,enemyHP-dmg); updateHPUI();
    const sp=document.getElementById('enemy-sprite');
    sp.classList.remove('hit'); void sp.offsetWidth; sp.classList.add('hit');
  }
  if(enemyHP<=0) setTimeout(showVictory,900);
  else{ setInstruction('もう一度攻撃！'); setMainBtn('reset'); }
}

// 勝利ライン点滅
function flashWins(hits){
  document.querySelectorAll('.winline-seg').forEach(s=>{
    s.style.background=''; s.style.boxShadow='';
  });
  for(let r=0;r<3;r++){
    const o=document.getElementById(`ro-${r}`);
    o.className='row-overlay'; o.style.background=o.style.border='';
  }
  const dc=document.getElementById('diag-canvas');
  dc.className=''; dc.getContext('2d').clearRect(0,0,dc.width,dc.height);
  if(!hits.length) return;

  hits.forEach(({line})=>{
    const col=line.color;
    const seg=document.getElementById(`wl-${line.id}`);
    if(seg){ seg.style.background=col; seg.style.boxShadow=`0 0 5px ${col}`; }
    if(line.type==='H'){
      const ov=document.getElementById(`ro-${line.row}`);
      ov.style.background=`${col}22`;
      ov.style.borderTop=`2px solid ${col}80`;
      ov.style.borderBottom=`2px solid ${col}80`;
      ov.classList.add('flash');
    } else {
      drawDiag(dc,line.diag,col);
      dc.className='flash';
    }
  });
}

function drawDiag(dc,diagType,col){
  const ctx=dc.getContext('2d');
  const w=dc.width, h=dc.height, cp=cellPx;
  const cw=w/3;
  const pts=diagType===0
    ?[[cw/2,cp/2],[cw+cw/2,cp+cp/2],[2*cw+cw/2,2*cp+cp/2]]
    :[[cw/2,2*cp+cp/2],[cw+cw/2,cp+cp/2],[2*cw+cw/2,cp/2]];
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=5;
  ctx.shadowColor=col; ctx.shadowBlur=14; ctx.globalAlpha=.7;
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.stroke(); ctx.restore();
}

// キャラアタックアニメ
function triggerCharAttack(i){
  const e=document.getElementById(`ce-${i}`);
  const a=document.getElementById(`ca-${i}`);
  if(e){ e.classList.remove('attack'); void e.offsetWidth; e.classList.add('attack'); }
  if(a){ a.style.color='#e8c840'; a.classList.add('show');
         setTimeout(()=>a.classList.remove('show'),700); }
}

// ════════════════════════════════════════════════════════════
// イベント / ゲームフロー
// ════════════════════════════════════════════════════════════
function onReelTap(i){
  if(gamePhase==='spinning'&&i<reels.length) stopReel(reels[i]);
}
function onMainBtn(){
  if(gamePhase==='idle') startGame();
  else if(gamePhase==='result') nextRound();
}
function onVictoryBtn(){
  document.getElementById('victory-overlay').classList.remove('show');
  init();
}

function startGame(){
  gamePhase='spinning'; clearResult();
  // 横・斜めオーバーレイをリセット
  for(let r=0;r<3;r++){
    const o=document.getElementById(`ro-${r}`);
    o.className='row-overlay'; o.style.background=o.style.border='';
  }
  const dc=document.getElementById('diag-canvas');
  dc.className=''; dc.getContext('2d').clearRect(0,0,dc.width,dc.height);
  document.querySelectorAll('.winline-seg').forEach(s=>{
    s.style.background=''; s.style.boxShadow='';
  });
  startAllReels();
  setInstruction('リールをタップして停止！');
  setMainBtn('disabled');
}

function nextRound(){
  clearResult();
  grid=[[0,0,0],[0,0,0],[0,0,0]];
  // ▼ reels の stopped/spinning フラグだけリセット — offset は保持
  reels.forEach(r=>{
    if(!r) return;
    r.stopped=false; r.spinning=false;
    r.colEl.className='reel-col';
    const a=document.getElementById(`ca-${r.index}`); if(a) a.classList.remove('show');
    drawReel(r); // 現在位置で再描画 (前回停止コマをそのまま表示)
  });
  gamePhase='idle';
  setInstruction('STARTを押してリールを回転させよう');
  setMainBtn('start');
}

function showVictory(){
  document.getElementById('victory-overlay').classList.add('show');
}

// UI helpers
function updateHPUI(){
  document.getElementById('hp-bar').style.width=(enemyHP/MAX_HP*100)+'%';
  document.getElementById('hp-text').textContent=`${enemyHP} / ${MAX_HP}`;
}
function clearResult(){
  const d=document.getElementById('damage-text');
  const s=document.getElementById('result-sub');
  d.classList.remove('show'); s.classList.remove('show');
  d.textContent='— DMG'; s.textContent='';
}
function setInstruction(t){ document.getElementById('instruction').textContent=t; }
function setMainBtn(mode){
  const b=document.getElementById('main-btn');
  if(mode==='start'){ b.className='start-btn'; b.textContent='START'; b.disabled=false; }
  else if(mode==='reset'){ b.className='reset-btn'; b.textContent='NEXT ROUND'; b.disabled=false; }
  else{ b.className='disabled'; b.textContent='STOP REELS'; b.disabled=true; }
}
function mk(tag,cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }

init();
</script>
