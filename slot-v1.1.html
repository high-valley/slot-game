<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Game</title>
<style>
body{
  background:#111;
  color:#fff;
  text-align:center;
}

#reels{
  display:flex;
  justify-content:center;
}

canvas{
  border:2px solid #fff;
  margin:5px;
}
</style>
</head>
<body>

<h2>Slot Game</h2>
<div id="reels"></div>
<button onclick="startSpin()">START</button>
<p id="result"></p>

<script>
const REEL_COUNT = 3;
const SYMBOLS = ["🔥","💧","⚡","⭐","💀"];
const REEL_HEIGHT = 100;
const VISIBLE_ROWS = 3;
const SPIN_SPEED = 8;

let reels = [];

function createReels(){
  const container = document.getElementById("reels");

  for(let i=0;i<REEL_COUNT;i++){
    const canvas = document.createElement("canvas");
    canvas.width = 100;
    canvas.height = REEL_HEIGHT * VISIBLE_ROWS;
    container.appendChild(canvas);

    const ctx = canvas.getContext("2d");

    reels.push({
      canvas,
      ctx,
      offset:0,
      spinning:false
    });

    canvas.addEventListener("click", ()=>stopReel(i));
  }
}

function draw(){
  reels.forEach((reel)=>{
    const ctx = reel.ctx;
    const w = reel.canvas.width;
    const h = reel.canvas.height;

    ctx.clearRect(0,0,w,h);

    for(let i=0;i<SYMBOLS.length;i++){
      let y = ((i * REEL_HEIGHT) + reel.offset) % (SYMBOLS.length * REEL_HEIGHT);

      // 図柄枠
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.strokeRect(10, y+10, w-20, REEL_HEIGHT-20);

      // 中央寄せ
      ctx.font = "30px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(SYMBOLS[i], w/2, y + REEL_HEIGHT/2);
    }

    // 中央ライン
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, h/2);
    ctx.lineTo(w, h/2);
    ctx.stroke();
  });
}

function update(){
  reels.forEach(reel=>{
    if(reel.spinning){
      // ★回転方向修正（上→下）
      reel.offset -= SPIN_SPEED;

      if(reel.offset < 0){
        reel.offset += SYMBOLS.length * REEL_HEIGHT;
      }
    }
  });

  draw();
  requestAnimationFrame(update);
}

function startSpin(){
  reels.forEach(reel=>{
    reel.spinning = true;
    // ★offsetはリセットしない → 前回位置から再開
  });
}

function stopReel(index){
  const reel = reels[index];
  reel.spinning = false;

  if(reels.every(r=>!r.spinning)){
    judge();
  }
}

function judge(){
  let results = reels.map(reel=>{
    return Math.floor((reel.offset + REEL_HEIGHT/2) / REEL_HEIGHT) % SYMBOLS.length;
  });

  let first = results[0];
  let isPerfect = results.every(r=>r === first);

  if(isPerfect){
    document.getElementById("result").innerText = "PERFECT!";
  }else{
    document.getElementById("result").innerText = "MISS";
  }
}

createReels();
update();
</script>

</body>
</html>
